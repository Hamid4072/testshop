<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فروشگاه حمید</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f3f4f6);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #1f2937);
            --hint: var(--tg-theme-hint-color, #6b7280);
            --btn: var(--tg-theme-button-color, #2563eb);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --price: #059669;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        h1, h2, h3 {
            color: var(--text);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .product, .cart {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000015;
        }

        .product {
            flex: 1 1 200px;
        }

        .product p {
            color: var(--hint);
        }

        .product .price,
        .price {
            color: var(--price);
            font-weight: bold;
        }

        button {
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        button:active {
            opacity: 0.8;
        }

        .cart {
            margin-top: 24px;
            margin-bottom: 70px;
        }

        #cart-items {
            line-height: 2;
            padding-right: 20px;
        }

        #total {
            font-size: 18px;
            font-weight: bold;
        }

        #clear-cart {
            background: transparent;
            color: #dc2626;
            border: 1px solid #dc2626;
        }
    </style>
</head>

<body>

    <h1>فروشگاه حمید</h1>
    <h2>محصولات ما</h2>

    <div class="products">

        <div class="product">
            <h3>هدفون بلوتوثی</h3>
            <p>هدفون باکیفیت با صدای شفاف</p>
            <p class="price">۱,۵۰۰,۰۰۰ تومان</p>
            <button class="add-to-cart"
                data-id="headphone" data-name="هدفون بلوتوثی" data-price="1500000">
                افزودن به سبد
            </button>
        </div>

        <div class="product">
            <h3>ساعت هوشمند</h3>
            <p>مناسب استفاده روزانه</p>
            <p class="price">۲,۲۰۰,۰۰۰ تومان</p>
            <button class="add-to-cart"
                data-id="watch" data-name="ساعت هوشمند" data-price="2200000">
                افزودن به سبد
            </button>
        </div>

        <div class="product">
            <h3>اسپیکر بلوتوثی</h3>
            <p>صدای قدرتمند و قابل حمل</p>
            <p class="price">۹۵۰,۰۰۰ تومان</p>
            <button class="add-to-cart"
                data-id="speaker" data-name="اسپیکر بلوتوثی" data-price="950000">
                افزودن به سبد
            </button>
        </div>

    </div>

    <div class="cart">
        <h2>🛒 سبد خرید</h2>

        <p>تعداد محصولات انتخاب‌شده: <span id="count">۰</span></p>

        <ul id="cart-items">
            <li>سبد خرید خالی است.</li>
        </ul>

        <p id="total">مبلغ کل: ۰ تومان</p>

        <button id="clear-cart">خالی کردن سبد</button>
    </div>

    <script>
        // ---------- تلگرام ----------
        const tg = window.Telegram && window.Telegram.WebApp;
        // initData فقط وقتی داخل تلگرام باز شود مقدار دارد
        const inTelegram = !!(tg && tg.initData);

        if (inTelegram) {
            tg.ready();
            tg.expand();
        }

        // ---------- سبد خرید ----------
        const STORAGE_KEY = "hamid-shop-cart";
        let cart = [];

        const countElement = document.getElementById("count");
        const itemsElement = document.getElementById("cart-items");
        const totalElement = document.getElementById("total");

        const formatPrice = number =>
            number.toLocaleString("fa-IR");

        function saveCart() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
            } catch (e) { /* ذخیره‌سازی در دسترس نیست */ }
        }

        function loadCart() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (Array.isArray(saved)) cart = saved;
            } catch (e) { /* نادیده گرفتن */ }
        }

        function updateMainButton(total) {
            if (!inTelegram) return;

            if (cart.length > 0) {
                tg.MainButton.setText("ثبت سفارش - " + formatPrice(total) + " تومان");
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        function updateCart() {
            countElement.textContent = formatPrice(cart.length);
            itemsElement.replaceChildren();

            if (cart.length === 0) {
                const item = document.createElement("li");
                item.textContent = "سبد خرید خالی است.";
                itemsElement.appendChild(item);
            }

            cart.forEach(product => {
                const item = document.createElement("li");
                item.textContent =
                    product.name + " - " +
                    formatPrice(product.price) + " تومان";
                itemsElement.appendChild(item);
            });

            const total = cart.reduce(
                (sum, product) => sum + product.price, 0
            );

            totalElement.textContent =
                "مبلغ کل: " + formatPrice(total) + " تومان";

            updateMainButton(total);
            saveCart();
        }

        document.querySelectorAll(".add-to-cart").forEach(button => {
            button.addEventListener("click", () => {
                const id = button.dataset.id;
                const name = button.dataset.name;
                const price = Number(button.dataset.price);

                cart.push({ id, name, price });
                updateCart();

                if (inTelegram) tg.HapticFeedback.impactOccurred("light");
            });
        });

        document.getElementById("clear-cart")
            .addEventListener("click", () => {
                cart.length = 0;
                updateCart();
            });

        // ---------- ثبت سفارش ----------
        function submitOrder() {
            if (cart.length === 0) return;

            // فقط شناسه محصول‌ها ارسال می‌شود؛ قیمت را ربات خودش محاسبه می‌کند
            const order = {
                items: cart.map(p => p.id)
            };

            if (inTelegram) {
                tg.sendData(JSON.stringify(order));
            } else {
                alert("این صفحه خارج از تلگرام باز شده است.\n" + JSON.stringify(order));
            }
        }

        if (inTelegram) {
            tg.MainButton.onClick(submitOrder);
        }

        // ---------- شروع ----------
        loadCart();
        updateCart();
    </script>

</body>
</html>
