<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>فروشگاه حمید</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: #f4f5fb;
            --surface: #ffffff;
            --surface-2: #eef0f8;
            --text: #161a2d;
            --muted: #6b7190;
            --border: #e3e6f2;
            --accent: #6d5efc;
            --accent-2: #3ec6ff;
            --accent-text: #ffffff;
            --green: #12a66b;
            --danger: #e5484d;
            --shadow: 0 8px 24px rgba(40, 45, 100, 0.10);
            --shadow-sm: 0 2px 8px rgba(40, 45, 100, 0.08);
        }

        :root[data-theme="dark"] {
            --bg: #0f1120;
            --surface: #181b30;
            --surface-2: #222642;
            --text: #eef0ff;
            --muted: #9aa0c4;
            --border: #2a2e4d;
            --green: #34d399;
            --danger: #ff6b70;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 150px;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        /* ---------- هدر ---------- */

        .hero {
            position: relative;
            padding: 36px 20px 64px;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 50%, var(--accent-2) 120%);
            color: #fff;
            overflow: hidden;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .hero::before {
            width: 220px;
            height: 220px;
            top: -80px;
            left: -60px;
        }

        .hero::after {
            width: 160px;
            height: 160px;
            bottom: -70px;
            right: -40px;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            font-size: 26px;
        }

        .hero h1 {
            margin: 0;
            font-size: 24px;
        }

        .hero p {
            margin: 14px 0 0;
            font-size: 14px;
            line-height: 1.9;
            opacity: 0.92;
        }

        /* ---------- ویژگی‌ها ---------- */

        .perks {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: -36px 16px 0;
        }

        .perk {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            font-size: 11.5px;
            color: var(--muted);
            box-shadow: var(--shadow);
        }

        .perk span {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }

        /* ---------- جستجو، مرتب‌سازی، دسته‌ها ---------- */

        .toolbar {
            display: flex;
            gap: 10px;
            margin: 20px 16px 0;
        }

        .search {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 46px;
            padding: 0 12px;
            background: var(--surface);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
        }

        .search input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .sort {
            height: 46px;
            border: none;
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            padding: 0 10px;
            font-family: inherit;
            font-size: 13px;
            box-shadow: var(--shadow-sm);
            outline: none;
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 14px 16px 2px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font-size: 13px;
            box-shadow: var(--shadow-sm);
            transition: background 0.2s, color 0.2s;
        }

        .chip.active {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
        }

        /* ---------- محصولات ---------- */

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 22px 20px 14px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 18px;
        }

        .section-title small {
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 0 16px;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 900px;
                margin: 0 auto;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(18px);
            animation: rise 0.5s ease forwards;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.98);
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .art {
            position: relative;
            height: 130px;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .art::before {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
        }

        .art .emoji {
            position: relative;
            font-size: 58px;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.25));
            animation: float 3.2s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-8px) rotate(3deg);
            }
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.92);
            color: #3b2fd1;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .fav {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: #9aa0c4;
            font-size: 18px;
            line-height: 1;
            display: grid;
            place-items: center;
            transition: transform 0.15s;
        }

        .fav.on {
            color: var(--danger);
        }

        .fav:active {
            transform: scale(0.85);
        }

        .info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .info h3 {
            margin: 0;
            font-size: 15px;
        }

        .info .desc {
            margin: 0;
            font-size: 12px;
            line-height: 1.7;
            color: var(--muted);
            flex: 1;
        }

        .price {
            font-weight: bold;
            font-size: 15px;
            color: var(--green);
        }

        .price small {
            font-weight: normal;
            font-size: 11px;
            color: var(--muted);
        }

        .actions {
            margin-top: 6px;
            min-height: 42px;
        }

        .add-btn {
            width: 100%;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: var(--accent-text);
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 6px 14px rgba(109, 94, 252, 0.35);
            transition: transform 0.15s;
        }

        .add-btn:active {
            transform: scale(0.96);
        }

        /* ---------- کنترل تعداد ---------- */

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-2);
            border-radius: 14px;
            padding: 4px;
            height: 42px;
        }

        .stepper button {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: var(--surface);
            color: var(--text);
            font-size: 18px;
            line-height: 1;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s;
        }

        .stepper button:active {
            transform: scale(0.9);
        }

        .stepper .qty {
            font-weight: bold;
            min-width: 28px;
            text-align: center;
        }

        /* ---------- نوار سبد ---------- */

        .cart-bar {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom));
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 20px;
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(160%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        body.in-telegram .cart-bar {
            bottom: calc(76px + env(safe-area-inset-bottom));
        }

        .cart-bar.visible {
            transform: translateY(0);
        }

        .cart-bar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-bar .count {
            min-width: 30px;
            height: 30px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .cart-bar .label {
            font-size: 14px;
            font-weight: bold;
            background: none;
            color: inherit;
        }

        .cart-bar .total {
            font-size: 14px;
            font-weight: bold;
        }

        /* ---------- پنل‌های کشویی ---------- */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(10, 12, 30, 0.55);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 31;
            max-height: 86vh;
            overflow-y: auto;
            background: var(--surface);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        body.in-telegram .sheet {
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
        }

        .sheet.open {
            transform: translateY(0);
        }

        .grabber {
            width: 44px;
            height: 5px;
            border-radius: 999px;
            background: var(--border);
            margin: 0 auto 14px;
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .sheet-head h2 {
            margin: 0;
            font-size: 18px;
        }

        .clear-btn {
            background: none;
            color: var(--danger);
            font-size: 13px;
            padding: 6px 8px;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 0;
            font-size: 14px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .row .thumb {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .row .meta {
            flex: 1;
            min-width: 0;
        }

        .row .meta b {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .row .meta span {
            font-size: 13px;
            color: var(--green);
            font-weight: bold;
        }

        .row .stepper {
            width: 112px;
            flex-shrink: 0;
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(109, 94, 252, 0.4);
        }

        /* فقط دکمه‌ی سبد مخفی می‌شود، نه دکمه‌ی ثبت نهایی فرم */
        body.in-telegram #checkout {
            display: none;
        }

        /* ---------- جزئیات محصول ---------- */

        .detail-art {
            position: relative;
            height: 190px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .detail-art::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
        }

        .detail-art .emoji {
            position: relative;
            font-size: 84px;
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.25));
            animation: float 3.2s ease-in-out infinite;
        }

        .detail-body h2 {
            margin: 16px 0 4px;
            font-size: 20px;
        }

        .detail-cat {
            color: var(--muted);
            font-size: 13px;
        }

        .detail-desc {
            margin: 12px 0;
            font-size: 14px;
            line-height: 1.9;
            color: var(--muted);
        }

        .detail-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--green);
            margin-bottom: 14px;
        }

        .detail-price small {
            font-size: 12px;
            font-weight: normal;
            color: var(--muted);
        }

        /* ---------- فرم اطلاعات مشتری ---------- */

        .customer-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-2);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        .form-error {
            color: var(--danger);
            font-size: 12px;
            display: none;
        }

        .form-error.show {
            display: block;
        }

        /* ---------- پیام کوتاه ---------- */

        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            z-index: 50;
            transform: translate(-50%, -140%);
            background: var(--text);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            box-shadow: var(--shadow);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            transform: translate(-50%, 0);
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 32px;
        }
    </style>
</head>

<body>

    <!-- هدر -->
    <header class="hero">
        <div class="hero-inner">
            <div class="brand">
                <div class="logo">🛍️</div>
                <h1>فروشگاه حمید</h1>
            </div>
            <p>
                جدیدترین گجت‌های دیجیتال با ضمانت اصالت و ارسال سریع،
                مستقیم از داخل تلگرام.
            </p>
        </div>
    </header>

    <!-- ویژگی‌ها -->
    <section class="perks">
        <div class="perk"><span>🚚</span>ارسال سریع</div>
        <div class="perk"><span>✅</span>ضمانت اصالت</div>
        <div class="perk"><span>💬</span>پشتیبانی</div>
    </section>

    <!-- جستجو و مرتب‌سازی -->
    <div class="toolbar">
        <div class="search">
            <span>🔍</span>
            <input id="search" type="search" placeholder="جستجوی محصول..." autocomplete="off">
        </div>
        <select id="sort" class="sort" aria-label="مرتب‌سازی">
            <option value="default">پیش‌فرض</option>
            <option value="cheap">ارزان‌ترین</option>
            <option value="expensive">گران‌ترین</option>
            <option value="fav">علاقه‌مندی‌ها اول</option>
        </select>
    </div>

    <div class="chips" id="chips"></div>

    <!-- محصولات -->
    <div class="section-title">
        <h2>محصولات</h2>
        <small id="products-count"></small>
    </div>

    <main class="grid" id="products"></main>

    <footer>ساخته‌شده با ❤️ توسط حمید</footer>

    <!-- نوار سبد -->
    <div class="cart-bar" id="cart-bar">
        <div class="left">
            <div class="count" id="bar-count">۰</div>
            <button class="label" id="open-cart">مشاهده سبد خرید</button>
        </div>
        <div class="total" id="bar-total">۰ تومان</div>
    </div>

    <!-- جزئیات محصول -->
    <div class="overlay" id="detail-overlay"></div>

    <section class="sheet" id="detail-sheet" aria-label="جزئیات محصول">
        <div class="grabber"></div>
        <div class="detail-body" id="detail-body"></div>
    </section>

    <!-- سبد خرید -->
    <div class="overlay" id="overlay"></div>

    <section class="sheet" id="sheet" aria-label="سبد خرید">
        <div class="grabber"></div>

        <div class="sheet-head">
            <h2>🛒 سبد خرید</h2>
            <button class="clear-btn" id="clear-cart">خالی کردن</button>
        </div>

        <div id="cart-items"></div>

        <div class="summary">
            <span>مبلغ کل</span>
            <span id="sheet-total">۰ تومان</span>
        </div>

        <button class="checkout-btn" id="checkout">ادامه و ثبت سفارش</button>
    </section>

    <!-- فرم اطلاعات مشتری -->
    <div class="overlay" id="customer-overlay"></div>

    <section class="sheet" id="customer-sheet">
        <div class="grabber"></div>

        <div class="sheet-head">
            <h2>📋 اطلاعات مشتری</h2>
        </div>

        <div class="customer-form">

            <div class="form-group">
                <label for="customer-name">نام و نام خانوادگی</label>
                <input type="text" id="customer-name" class="form-input"
                    placeholder="مثلاً حمید محمدی" autocomplete="name">
                <div class="form-error" id="name-error">لطفاً نام و نام خانوادگی را وارد کنید.</div>
            </div>

            <div class="form-group">
                <label for="customer-phone">شماره تماس</label>
                <input type="tel" id="customer-phone" class="form-input"
                    placeholder="مثلاً 09121234567" autocomplete="tel" inputmode="tel">
                <div class="form-error" id="phone-error">لطفاً شماره تماس معتبر وارد کنید.</div>
            </div>

            <button class="checkout-btn" id="final-submit">ثبت نهایی سفارش</button>

        </div>
    </section>

    <!-- پیام -->
    <div class="toast" id="toast"></div>

    <script>

        // ---------- تلگرام ----------

        const tg = window.Telegram && window.Telegram.WebApp;
        const inTelegram = !!(tg && tg.initData);

        if (inTelegram) {
            tg.ready();
            tg.expand();
            document.body.classList.add("in-telegram");
        }

        // ---------- تم ----------

        function applyTheme() {
            let scheme = "light";

            if (inTelegram && tg.colorScheme) {
                scheme = tg.colorScheme;
            } else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
                scheme = "dark";
            }

            document.documentElement.setAttribute("data-theme", scheme);

            if (inTelegram) {
                try {
                    const bg = getComputedStyle(document.documentElement)
                        .getPropertyValue("--bg").trim();
                    tg.setHeaderColor(bg);
                    tg.setBackgroundColor(bg);
                } catch (e) {
                    // نسخه قدیمی تلگرام
                }
            }
        }

        applyTheme();

        if (inTelegram) {
            tg.onEvent("themeChanged", applyTheme);
        }

        // ---------- محصولات ----------
        // لیست محصولات را ربات داخل آدرس (پارامتر p) می‌فرستد.
        // اگر پارامتر نبود (مثلاً باز کردن مستقیم صفحه)، این لیست پیش‌فرض نمایش داده می‌شود.

        const DEFAULTS = [
            { i: "headphone", n: "هدفون بلوتوثی", p: 1500000, e: "🎧", c: "صوتی", d: "صدای شفاف و باس قوی، مناسب کار و سفر" },
            { i: "earbuds", n: "ایرباد بی‌سیم", p: 1100000, e: "🎵", c: "صوتی", d: "کوچک، سبک و با کیفیت صدای عالی" },
            { i: "speaker", n: "اسپیکر بلوتوثی", p: 950000, e: "🔊", c: "صوتی", d: "قابل حمل، ضدآب و با صدای قدرتمند" },
            { i: "watch", n: "ساعت هوشمند", p: 2200000, e: "⌚", c: "پوشیدنی", d: "نمایشگر روشن، پایش فعالیت و اعلان‌ها" },
            { i: "powerbank", n: "پاوربانک ۲۰ هزار", p: 780000, e: "🔋", c: "لوازم جانبی", d: "ظرفیت بالا با شارژ سریع" },
            { i: "charger", n: "شارژر سریع ۶۵ وات", p: 540000, e: "⚡", c: "لوازم جانبی", d: "شارژ سریع برای گوشی و لپ‌تاپ" },
            { i: "keyboard", n: "کیبورد مکانیکی", p: 1850000, e: "⌨️", c: "کامپیوتر", d: "سوئیچ مکانیکی و نورپردازی RGB" },
            { i: "mouse", n: "ماوس بی‌سیم", p: 420000, e: "🖱️", c: "کامپیوتر", d: "دقیق، بی‌صدا و با باتری بادوام" },
            { i: "webcam", n: "وب‌کم Full HD", p: 890000, e: "📷", c: "کامپیوتر", d: "تصویر شفاف برای جلسه و استریم" }
        ];

        const DESC_FALLBACK = Object.fromEntries(DEFAULTS.map(x => [x.i, x.d]));

        function decodeProducts() {
            try {
                const raw = new URLSearchParams(location.search).get("p");
                if (!raw) return null;

                let b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
                while (b64.length % 4) b64 += "=";

                const bin = atob(b64);
                const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
                const arr = JSON.parse(new TextDecoder().decode(bytes));

                if (!Array.isArray(arr)) return null;

                const valid = arr.filter(x =>
                    x && typeof x.i === "string" && typeof x.n === "string" &&
                    typeof x.p === "number" && x.p > 0 &&
                    typeof x.e === "string" && typeof x.c === "string"
                );

                return valid.length ? valid : null;
            } catch (e) {
                return null;
            }
        }

        const PALETTE = [
            ["#6d5efc", "#a78bfa"],
            ["#0ea5e9", "#38e1c9"],
            ["#f97316", "#fbbf24"],
            ["#ec4899", "#f472b6"],
            ["#10b981", "#34d399"],
            ["#ef4444", "#fb923c"]
        ];

        function gradFor(key) {
            let h = 0;
            for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return PALETTE[h % PALETTE.length];
        }

        const PRODUCTS = (decodeProducts() || DEFAULTS).map(x => ({
            id: x.i,
            name: x.n,
            price: x.p,
            emoji: x.e,
            cat: x.c,
            desc: x.d || DESC_FALLBACK[x.i] || "",
            grad: gradFor(x.c)
        }));

        const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));

        // ---------- ابزارها ----------

        const fa = n => n.toLocaleString("fa-IR");
        const money = n => fa(n) + " تومان";
        const $ = id => document.getElementById(id);

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // تبدیل ارقام فارسی و عربی به انگلیسی
        function normalizeDigits(str) {
            return str
                .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
                .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        }

        // ---------- پیام ----------

        let toastTimer;

        function toast(message) {
            const t = $("toast");
            t.textContent = message;
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
        }

        // ---------- ویبره تلگرام ----------

        function haptic(type) {
            if (inTelegram && tg.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(type || "light");
                } catch (e) {}
            }
        }

        // ---------- ذخیره‌سازی ----------

        const CART_KEY = "hamid-shop-cart-v2";
        const FAV_KEY = "hamid-shop-fav-v1";

        let cart = {};
        let favs = new Set();

        function saveCart() {
            try {
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
            } catch (e) {}
        }

        function loadCart() {
            try {
                const saved = JSON.parse(localStorage.getItem(CART_KEY));

                if (saved && typeof saved === "object") {
                    Object.keys(saved).forEach(id => {
                        const q = Number(saved[id]);
                        if (byId[id] && q > 0) {
                            cart[id] = Math.min(q, 20);
                        }
                    });
                }
            } catch (e) {}
        }

        function loadFavs() {
            try {
                const saved = JSON.parse(localStorage.getItem(FAV_KEY));
                if (Array.isArray(saved)) {
                    saved.forEach(id => {
                        if (byId[id]) favs.add(id);
                    });
                }
            } catch (e) {}
        }

        function saveFavs() {
            try {
                localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
            } catch (e) {}
        }

        function totals() {
            let count = 0;
            let total = 0;

            Object.keys(cart).forEach(id => {
                count += cart[id];
                total += cart[id] * byId[id].price;
            });

            return { count, total };
        }

        function changeQty(id, delta) {
            const next = (cart[id] || 0) + delta;

            if (next <= 0) {
                delete cart[id];
            } else {
                cart[id] = Math.min(next, 20);
            }

            haptic("light");
            updateUI();
        }

        // ---------- علاقه‌مندی‌ها ----------

        function makeFavButton(id) {
            const btn = el("button", "fav" + (favs.has(id) ? " on" : ""), favs.has(id) ? "♥" : "♡");
            btn.dataset.fav = id;
            btn.setAttribute("aria-label", "علاقه‌مندی");

            btn.addEventListener("click", e => {
                e.stopPropagation();
                toggleFav(id);
            });

            return btn;
        }

        function toggleFav(id) {
            if (favs.has(id)) {
                favs.delete(id);
            } else {
                favs.add(id);
            }

            saveFavs();
            haptic("light");

            document.querySelectorAll('[data-fav="' + id + '"]').forEach(btn => {
                const on = favs.has(id);
                btn.classList.toggle("on", on);
                btn.textContent = on ? "♥" : "♡";
            });
        }

        // ---------- کنترل تعداد ----------

        function makeStepper(id) {
            const box = el("div", "stepper");
            const plus = el("button", "", "+");
            const qty = el("span", "qty", fa(cart[id] || 0));
            const minus = el("button", "", "−");

            plus.setAttribute("aria-label", "افزایش");
            minus.setAttribute("aria-label", "کاهش");

            plus.addEventListener("click", e => {
                e.stopPropagation();
                changeQty(id, 1);
            });

            minus.addEventListener("click", e => {
                e.stopPropagation();
                changeQty(id, -1);
            });

            box.append(plus, qty, minus);
            return box;
        }

        function fillActions(box, p) {
            box.replaceChildren();

            if (cart[p.id]) {
                box.appendChild(makeStepper(p.id));
            } else {
                const btn = el("button", "add-btn", "افزودن به سبد");

                btn.addEventListener("click", e => {
                    e.stopPropagation();
                    changeQty(p.id, 1);
                    toast(p.emoji + " " + p.name + " به سبد اضافه شد");
                });

                box.appendChild(btn);
            }
        }

        // ---------- فیلتر و مرتب‌سازی ----------

        let activeCat = "همه";
        let searchText = "";
        let sortMode = "default";

        function visibleProducts() {
            const q = searchText.trim().toLowerCase();

            let list = PRODUCTS.filter(p => {
                if (activeCat !== "همه" && p.cat !== activeCat) return false;
                if (q && !(p.name + " " + p.cat + " " + p.desc).toLowerCase().includes(q)) return false;
                return true;
            });

            if (sortMode === "cheap") {
                list = list.slice().sort((a, b) => a.price - b.price);
            } else if (sortMode === "expensive") {
                list = list.slice().sort((a, b) => b.price - a.price);
            } else if (sortMode === "fav") {
                list = list.slice().sort((a, b) => (favs.has(b.id) ? 1 : 0) - (favs.has(a.id) ? 1 : 0));
            }

            return list;
        }

        function renderChips() {
            const box = $("chips");
            box.replaceChildren();

            const cats = ["همه", ...new Set(PRODUCTS.map(p => p.cat))];

            cats.forEach(cat => {
                const chip = el("button", "chip" + (cat === activeCat ? " active" : ""), cat);

                chip.addEventListener("click", () => {
                    activeCat = cat;
                    renderChips();
                    renderProducts();
                });

                box.appendChild(chip);
            });
        }

        // ---------- محصولات ----------

        let actionBoxes = {};

        function renderProducts() {
            const grid = $("products");
            grid.replaceChildren();
            actionBoxes = {};

            const list = visibleProducts();

            $("products-count").textContent = fa(list.length) + " کالا";

            if (list.length === 0) {
                grid.appendChild(el("div", "no-results", "محصولی پیدا نشد 🔍"));
                return;
            }

            list.forEach((p, i) => {
                const card = el("article", "card");
                card.style.animationDelay = (Math.min(i, 8) * 70) + "ms";

                const art = el("div", "art");
                art.style.background =
                    "linear-gradient(135deg, " + p.grad[0] + ", " + p.grad[1] + ")";

                art.append(
                    el("span", "emoji", p.emoji),
                    el("span", "badge", p.cat),
                    makeFavButton(p.id)
                );

                const info = el("div", "info");

                const price = el("div", "price", fa(p.price) + " ");
                price.append(el("small", "", "تومان"));

                const actions = el("div", "actions");
                actionBoxes[p.id] = actions;
                fillActions(actions, p);

                info.append(
                    el("h3", "", p.name),
                    el("p", "desc", p.desc),
                    price,
                    actions
                );

                card.append(art, info);

                card.addEventListener("click", () => openDetail(p.id));

                grid.appendChild(card);
            });
        }

        function renderActions() {
            Object.keys(actionBoxes).forEach(id => {
                fillActions(actionBoxes[id], byId[id]);
            });

            if (detailId && $("detail-sheet").classList.contains("open")) {
                const box = $("detail-actions");
                if (box) fillActions(box, byId[detailId]);
            }
        }

        // ---------- جزئیات محصول ----------

        let detailId = null;

        function openDetail(id) {
            const p = byId[id];
            if (!p) return;

            detailId = id;

            const body = $("detail-body");
            body.replaceChildren();

            const art = el("div", "detail-art");
            art.style.background =
                "linear-gradient(135deg, " + p.grad[0] + ", " + p.grad[1] + ")";
            art.append(el("span", "emoji", p.emoji), makeFavButton(p.id));

            const price = el("div", "detail-price", fa(p.price) + " ");
            price.append(el("small", "", "تومان"));

            const actions = el("div", "actions");
            actions.id = "detail-actions";
            fillActions(actions, p);

            body.append(
                art,
                el("h2", "", p.name),
                el("div", "detail-cat", "دسته: " + p.cat),
                el("p", "detail-desc", p.desc || "توضیحاتی ثبت نشده است."),
                price,
                actions
            );

            $("detail-overlay").classList.add("open");
            $("detail-sheet").classList.add("open");
        }

        function closeDetail() {
            detailId = null;
            $("detail-overlay").classList.remove("open");
            $("detail-sheet").classList.remove("open");
        }

        $("detail-overlay").addEventListener("click", closeDetail);

        // ---------- نمایش سبد ----------

        function renderSheet() {
            const list = $("cart-items");
            list.replaceChildren();

            const ids = Object.keys(cart);

            if (ids.length === 0) {
                list.appendChild(el("div", "empty", "سبد خرید خالی است 🛒"));
                return;
            }

            ids.forEach(id => {
                const p = byId[id];
                const row = el("div", "row");

                const thumb = el("div", "thumb", p.emoji);
                thumb.style.background =
                    "linear-gradient(135deg, " + p.grad[0] + ", " + p.grad[1] + ")";

                const meta = el("div", "meta");
                meta.append(
                    el("b", "", p.name),
                    el("span", "", money(p.price * cart[id]))
                );

                row.append(thumb, meta, makeStepper(id));
                list.appendChild(row);
            });
        }

        // ---------- دکمه اصلی تلگرام ----------

        function isCustomerFormOpen() {
            return $("customer-sheet").classList.contains("open");
        }

        // متن و وضعیت دکمه اصلی را بر اساس مرحله (سبد / فرم) تنظیم می‌کند
        function updateMainButton() {
            if (!inTelegram) return;

            const { count, total } = totals();

            if (count === 0) {
                tg.MainButton.hide();
                return;
            }

            if (isCustomerFormOpen()) {
                tg.MainButton.setText("ثبت نهایی سفارش - " + money(total));
            } else {
                tg.MainButton.setText("ادامه و ثبت سفارش - " + money(total));
            }

            tg.MainButton.show();
        }

        // ---------- به‌روزرسانی UI ----------

        function updateUI() {
            const { count, total } = totals();

            $("bar-count").textContent = fa(count);
            $("bar-total").textContent = money(total);
            $("sheet-total").textContent = money(total);
            $("cart-bar").classList.toggle("visible", count > 0);

            renderActions();
            renderSheet();

            if (count === 0) {
                closeSheet();
                closeCustomerForm();
            }

            updateMainButton();
            saveCart();
        }

        // ---------- باز و بسته کردن سبد ----------

        function openSheet() {
            closeDetail();
            $("overlay").classList.add("open");
            $("sheet").classList.add("open");
        }

        function closeSheet() {
            $("overlay").classList.remove("open");
            $("sheet").classList.remove("open");
        }

        $("open-cart").addEventListener("click", openSheet);

        $("cart-bar").addEventListener("click", e => {
            if (e.target.id !== "open-cart") {
                openSheet();
            }
        });

        $("overlay").addEventListener("click", closeSheet);

        $("clear-cart").addEventListener("click", () => {
            cart = {};
            haptic("medium");
            updateUI();
        });

        // ---------- فرم مشتری ----------

        function openCustomerForm() {
            const { count } = totals();

            if (count === 0) {
                toast("سبد خرید خالی است");
                return;
            }

            closeSheet();
            closeDetail();

            $("customer-overlay").classList.add("open");
            $("customer-sheet").classList.add("open");

            updateMainButton();
        }

        function closeCustomerForm() {
            $("customer-overlay").classList.remove("open");
            $("customer-sheet").classList.remove("open");

            updateMainButton();
        }

        $("customer-overlay").addEventListener("click", closeCustomerForm);

        // وقتی کیبورد باز می‌شود، فیلد فعال در دید بماند
        ["customer-name", "customer-phone"].forEach(id => {
            $(id).addEventListener("focus", e => {
                setTimeout(() => {
                    e.target.scrollIntoView({ block: "center", behavior: "smooth" });
                }, 300);
            });
        });

        // ---------- اعتبارسنجی ----------

        function validateCustomerForm() {
            const name = $("customer-name").value.trim();
            const phone = normalizeDigits($("customer-phone").value.trim());

            let valid = true;

            $("name-error").classList.remove("show");
            $("phone-error").classList.remove("show");

            if (name.length < 3) {
                $("name-error").classList.add("show");
                valid = false;
            }

            const phoneNumber = phone.replace(/[\s-]/g, "");
            const phoneRegex = /^(?:\+98|0098|98|0)?9\d{9}$/;

            if (!phoneRegex.test(phoneNumber)) {
                $("phone-error").classList.add("show");
                valid = false;
            }

            return { valid, name, phone: phoneNumber };
        }

        // ---------- ساخت سفارش ----------

        function createOrder() {
            const validation = validateCustomerForm();

            if (!validation.valid) {
                haptic("medium");
                return;
            }

            const items = [];

            Object.keys(cart).forEach(id => {
                for (let i = 0; i < cart[id]; i++) {
                    items.push(id);
                }
            });

            if (items.length === 0) {
                toast("سبد خرید خالی است");
                return;
            }

            const { total } = totals();

            const order = {
                customer: {
                    name: validation.name,
                    phone: validation.phone
                },
                items: items,
                total: total
            };

            // سبد و فرم قبل از ارسال پاک می‌شوند (چون sendData برنامه را می‌بندد)
            cart = {};
            $("customer-name").value = "";
            $("customer-phone").value = "";
            updateUI();

            if (inTelegram) {
                haptic("medium");
                tg.sendData(JSON.stringify(order));
            } else {
                console.log("سفارش:", order);
                toast("سفارش آماده ارسال است؛ صفحه خارج از تلگرام باز شده.");
            }
        }

        // ---------- دکمه‌ها ----------

        $("checkout").addEventListener("click", openCustomerForm);
        $("final-submit").addEventListener("click", createOrder);

        // دکمه اصلی تلگرام بسته به مرحله رفتار می‌کند
        if (inTelegram) {
            tg.MainButton.onClick(() => {
                if (isCustomerFormOpen()) {
                    createOrder();
                } else {
                    openCustomerForm();
                }
            });
        }

        // جستجو و مرتب‌سازی
        $("search").addEventListener("input", e => {
            searchText = e.target.value;
            renderProducts();
        });

        $("sort").addEventListener("change", e => {
            sortMode = e.target.value;
            renderProducts();
        });

        // ---------- شروع ----------

        loadCart();
        loadFavs();
        renderChips();
        renderProducts();
        updateUI();

    </script>

</body>

</html>
